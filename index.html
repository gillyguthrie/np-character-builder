<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nerevarine Prophecies Character Builder</title>
<style>
:root{--bg:#17140f;--panel:#211c14;--panel2:#2a2417;--ink:#e8dfc8;--ink2:#b3a687;--muted:#7d7360;--gold:#c9a45c;--line:#3a3222;
--good:#7dbf7d;--warn:#d9b45b;--bad:#d97b6c;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Georgia,'Times New Roman',serif;padding:14px}
h1{font-size:20px;color:var(--gold);margin:0 0 10px;letter-spacing:.04em}
.wrap{display:flex;gap:12px;align-items:flex-start}
details.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;flex:0 0 auto}
details.col[open]{flex:1 1 0;min-width:0}
details.col > summary{cursor:pointer;padding:8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2)}
details.col > .colbody{padding:0 14px 14px}
.bdnote{font-size:10.5px !important;color:var(--muted)}
.bdnote span{color:var(--muted) !important}
#col-char[open]{flex:0 0 360px}
.gutter{flex:0 0 6px;align-self:stretch;cursor:col-resize;border-radius:3px;position:relative}
.gutter::after{content:'';position:absolute;left:2px;right:2px;top:0;bottom:0;background:var(--line);border-radius:2px;opacity:.5}
.gutter:hover::after,.gutter.drag::after{background:var(--gold);opacity:.9}
.slot{display:grid;grid-template-columns:92px 70px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.slot label{color:var(--ink2);font-size:12px}
select,input[type=text]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font:12px Georgia,serif}
select{width:100%}
.slot input{width:70px;font-size:11px}
details.msec{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel2)}
details.msec summary{cursor:pointer;padding:6px 10px;font-size:12px;color:var(--ink2)}
.fam{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:baseline;padding:2px 0;font-size:12px;border-bottom:1px dotted #332c1d}
.fam:last-child{border-bottom:none}
.fam .rk{white-space:nowrap;color:var(--muted);font-size:11px}
.fam .rk label{cursor:pointer;margin-left:2px}
.subhead{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold);margin:8px 0 2px}
.mgroup{padding:2px 10px 8px}
.aff{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.tile.sel, tr.rrow.sel td{outline:2px solid var(--gold);outline-offset:-2px}
.tile .v{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .k.t-hp{color:#e06c6c;font-weight:700}
.tile .k.t-mag{color:#6ea8e8;font-weight:700}
.tile .k.t-fat{color:#7fc97f;font-weight:700}
.tile .k.t-attr{color:var(--ink);font-weight:700}
.s-regen{color:#8fd0c9}
.tile .d{font-size:11px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.num{text-align:right}
.capped{color:var(--good)} .neg{color:var(--bad)} .warnc{color:var(--warn)}
.rrow{cursor:pointer}
#breakdown,#breakdown2,#breakdown3{background:var(--panel2);border:2px solid var(--gold);border-radius:6px;padding:8px 10px;margin-top:10px;font-size:12px;display:none}
#breakdown h3,#breakdown2 h3,#breakdown3 h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
#breakdown div,#breakdown2 div,#breakdown3 div{display:flex;justify-content:space-between;border-bottom:1px dotted #332c1d;padding:1px 0}
.s-mast{color:#9fb6dc}.s-race,.s-sign{color:#94c294}.s-base{color:var(--muted)}.s-debuff{color:var(--bad)}.s-cat{color:var(--gold)}
.bdcat{font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:5px;border-bottom:none !important}
.bdcat span:first-child{opacity:.9}
#breakdown2{margin:0 0 10px}
#breakdown3{margin:6px 0 10px}
#mtable td{font-size:11.5px;padding:2px 6px}
.debuff{background:#2e2016;border:1px solid #5a3a24;border-radius:6px;padding:8px 10px;margin-top:10px}
#shot{width:100%;border:1px solid var(--line);border-radius:6px;display:none}
#shotcap{font-size:11px;color:var(--muted);margin-top:3px}
.saverow{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.saverow button,#clearall{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:12px Georgia,serif;cursor:pointer}
button:hover{border-color:var(--gold)}
.mpline{font-size:12px;color:var(--ink2);margin-top:10px}
</style></head><body>
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><h1 style="margin:0">Nerevarine Prophecies Character Builder</h1><button id="clearall" type="button" title="Reset the whole builder to defaults — race, birthsign, spec, all masteries, equipment, weapon, armor skills, vampire/werewolf" style="flex:none">Clear everything</button></div>
<div style="font-size:12px;color:var(--ink2);margin:-6px 0 10px">Click any tile or resistance row to see its breakout — click again to close. Equip gear, toggle masteries, and every number updates live.</div>
<div class="saverow">
  <span style="color:var(--ink2);font-size:12px">Loadout:</span>
  <input type="text" id="savename" placeholder="loadout name" style="width:160px">
  <button id="btnsave" title="Downloads a small .json file you can keep or share">Save to file</button>
  <button id="btnload" title="Open a previously saved loadout .json">Load file</button>
  <input type="file" id="loadfile" accept=".json,application/json" style="display:none">
</div>
<div class="wrap">
<details class="col" id="col-equip" open><summary>Equipment</summary><div class="colbody">
<div style="margin:0 0 8px"><button id="unequipall" type="button">Unequip All</button></div>
<div style="display:flex;gap:10px;margin:2px 0 6px">
  <div class="tile" data-k="enc" style="flex:1"><div class="k">Encumbrance</div><div class="v" id="encv">0</div><div class="d" id="encd"></div></div>
  <div class="tile" data-k="ar" style="flex:1"><div class="k">Armor</div><div class="v" id="eqarv">0</div><div class="d" id="eqard"></div></div>
</div>
<div id="breakdown3"></div>
<div style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 0 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;font-size:12px;color:var(--ink)">
  <span style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700" title="Type your BASE (trained) skill. When masteries, equipment, or vampirism fortify a skill, a 'Modified' line appears below it and the modified value is what the Armor math uses.">Base armor skills</span>
  <span style="display:inline-flex;flex-direction:column"><label>Unarmored <input type="text" id="unarm" value="100" style="width:44px"></label><span class="skmod" id="mod_unarm" style="display:none;font-size:11px;color:var(--gold)"></span></span>
  <span style="display:inline-flex;flex-direction:column"><label>Light <input type="text" id="sk_light" value="100" style="width:44px"></label><span class="skmod" id="mod_la" style="display:none;font-size:11px;color:var(--gold)"></span></span>
  <span style="display:inline-flex;flex-direction:column"><label>Medium <input type="text" id="sk_medium" value="100" style="width:44px"></label><span class="skmod" id="mod_ma" style="display:none;font-size:11px;color:var(--gold)"></span></span>
  <span style="display:inline-flex;flex-direction:column"><label>Heavy <input type="text" id="sk_heavy" value="100" style="width:44px"></label><span class="skmod" id="mod_ha" style="display:none;font-size:11px;color:var(--gold)"></span></span>
</div>
<div id="slots"></div>
<div class="slot" style="margin-top:8px;grid-template-columns:92px 70px 1fr 48px"><label>Weapon</label><input type="text" id="wsearch" placeholder="search"><select id="weapon"></select><input type="text" data-wt="__weapon" placeholder="wt" title="Weapon weight — editable" style="width:44px"></div>
<div style="margin-top:10px;text-align:center"><img id="shot"><div id="shotcap">Select an item to see its screenshot.</div></div>
</div></details>
<details class="col" id="col-char" open><summary>Character</summary><div class="colbody">
<div class="slot" style="grid-template-columns:92px 1fr"><label style="font-weight:700;color:var(--ink)">Race</label><select id="race"></select></div>
<div style="font-size:11px;color:var(--ink2);margin:2px 0 6px" id="racenote"></div>
<div class="slot" style="grid-template-columns:92px 1fr"><label style="font-weight:700;color:var(--ink)">Birthsign</label><select id="sign"></select></div>
<div style="font-size:11px;color:var(--ink2);margin:2px 0 8px" id="signnote"></div>
<div class="slot" style="grid-template-columns:92px 1fr"><label style="font-weight:700;color:var(--ink)">Spec</label><select id="cls" title="Specialization (the server's term): combat, magic, or stealth. Drives the mastery trees, equipment gating, the spec attribute, and the ability list."><option value="">— select —</option><option>Stealth</option><option>Combat</option><option>Magic</option></select></div>
<div style="font-size:11px;color:var(--ink2);margin:2px 0 8px" id="clsnote"></div>
<div class="slot" style="grid-template-columns:92px 1fr auto;gap:6px"><label style="font-weight:700;color:var(--ink)">Presets</label><select id="presets"></select><button id="btnpreset">Load</button></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 8px;font-size:12px;color:var(--ink2)">
  <label style="display:flex;gap:5px;align-items:center" title="Passives: +20 Agi/Str/Wil/Spe · +30 Unarmored/Sneak/Hand-to-Hand/Athletics/Destruction/Illusion/Mysticism/Acrobatics · Resist Paralysis 100 · Disease immunity 100 · Resist Normal Weapons 50 · Weakness to Fire 50. (Owner-corrected 8/24: skill passives are +30 base; the old +50 Unarmored/Sneak/H2H reading came from a Berne vampire, whose clan trio adds +20 on top.) Skill bonuses show as 'Modified' under the Base armor skills — the base fields are not overwritten."><input type="checkbox" id="vamp"> Vampire</label>
  <label id="vampclanwrap" style="display:none;gap:5px;align-items:center" title="Vampire clan: each adds +20 to one attribute and three skills — Aundae: Wil, Short Blade/Mysticism/Destruction · Berne: Agi, Sneak/Unarmored/Hand-to-Hand · Quarra: Str, Blunt/Hand-to-Hand/Heavy Armor. Armor-skill bonuses appear on the Modified lines, not written into the base fields."><select id="vampclan"><option value="Aundae">Aundae Clan</option><option value="Berne">Berne Clan</option><option value="Quarra">Quarra Clan</option></select></label>
  <label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="wolf"> Werewolf</label>
</div>
<div class="tiles" id="tiles"></div>
<div id="breakdown2"></div>
<table id="resists"></table>
<div id="breakdown"></div>
<div class="debuff"><label style="display:flex;gap:8px;font-size:12.5px"><input type="checkbox" id="firedebuff"> Fire camp debuff active (−70 Fire, mob-cast)</label></div>
</div></details>
<details class="col" id="col-mast" open><summary>Masteries</summary><div class="colbody">
<div class="mpline" id="mpline" style="margin:6px 0 4px"></div>
<table id="mtable" style="margin-bottom:8px"></table>
<div style="margin:8px 0"><button id="clearmast" type="button">clear all</button></div>
<div id="masteries"></div>
</div></details>
</div>

    const o = {};
    cols.forEach(c => { const m = /0 0 ([\d.]+)px/.exec(c.style.flex||''); if(m) o[c.id] = +m[1]; });
    try { localStorage.setItem(LSW, JSON.stringify(o)); } catch(e){}
  }
  // gutters between consecutive columns
  for(let i=0;i<cols.length-1;i++){
    const g = document.createElement('div');
    g.className = 'gutter';
    g.title = 'Drag to resize · double-click to reset';
    cols[i].after(g);
    const L = cols[i], R = cols[i+1];
    g.addEventListener('dblclick', ()=>{ L.style.flex=''; R.style.flex=''; persist(); });
    g.addEventListener('mousedown', e => {
      if(!L.open || !R.open) return;
      e.preventDefault();
      const x0 = e.clientX, lw = L.getBoundingClientRect().width, rw = R.getBoundingClientRect().width;
      g.classList.add('drag');
      document.body.style.userSelect = 'none';
      function mv(ev){
        const dx = Math.max(-(lw-160), Math.min(rw-160, ev.clientX - x0));
        L.style.flex = '0 0 ' + (lw+dx) + 'px';
        R.style.flex = '0 0 ' + (rw-dx) + 'px';
      }
      function up(){
        g.classList.remove('drag');
        document.body.style.userSelect = '';
        window.removeEventListener('mousemove', mv);
        window.removeEventListener('mouseup', up);
        persist();
      }
      window.addEventListener('mousemove', mv);
      window.addEventListener('mouseup', up);
    });
  }
  // right-edge gutter so the LAST column can be widened too (page scrolls horizontally if needed)
  {
    const L = cols[cols.length-1];
    const g = document.createElement('div');
    g.className = 'gutter';
    g.title = 'Drag to resize · double-click to reset';
    L.after(g);
    g.addEventListener('dblclick', ()=>{ L.style.flex=''; persist(); });
    g.addEventListener('mousedown', e => {
      if(!L.open) return;
      e.preventDefault();
      const x0 = e.clientX, lw = L.getBoundingClientRect().width;
      g.classList.add('drag');
      document.body.style.userSelect = 'none';
      function mv(ev){
        const dx = Math.max(-(lw-160), ev.clientX - x0);
        L.style.flex = '0 0 ' + (lw+dx) + 'px';
      }
      function up(){
        g.classList.remove('drag');
        document.body.style.userSelect = '';
        window.removeEventListener('mousemove', mv);
        window.removeEventListener('mouseup', up);
        persist();
      }
      window.addEventListener('mousemove', mv);
      window.addEventListener('mouseup', up);
    });
  }
  // collapsing a column: drop its inline width so it shrinks to the summary; restore on reopen
  cols.forEach(c => c.addEventListener('toggle', ()=>{
    if(!c.open){ const m=/0 0 ([\d.]+)px/.exec(c.style.flex||''); if(m){ c.dataset.w=m[1]; c.style.flex=''; } }
    else if(c.dataset.w){ c.style.flex='0 0 '+c.dataset.w+'px'; }
  }));
})();

document.body.insertAdjacentHTML('beforeend', '<div style="margin:14px 0 6px;font-size:11px;color:var(--muted)">Nerevarine Prophecies Character Builder — community edition v1.21 · 2026-08-25 · formulas from in-game measurement · report errors on the server Discord</div>');
</script></body></html>
